# Generate the Xcode project with: cd ios && xcodegen generate
name: VoiceTrim
options:
  deploymentTarget:
    iOS: "26.0"  # Liquid Glass
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: Q8N3TM7R8M  # Samuel Paik-Heintz (Personal Team)
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    # Free Apple IDs need a bundle ID no one else has registered; change it if signing fails.
    BUNDLE_ID: com.samuelpaikheintz.sift
targets:
  VoiceTrim:
    type: application.messages
    platform: iOS
    sources: [VoiceTrim]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon  # shown in the Messages + menu
    info:
      path: VoiceTrim/Info.plist
      properties:
        CFBundleDisplayName: Siftr
        # iOS checks privacy permissions against the containing app, so the usage strings belong here too.
        NSMicrophoneUsageDescription: &mic Siftr records your voice message so it can remove ums and long pauses before you send it.
        NSSpeechRecognitionUsageDescription: &speech Siftr transcribes your message on your iPhone to find ums and repeats.
    dependencies:
      - target: VoiceTrimExtension
        embed: true
  VoiceTrimExtension:
    type: app-extension.messages
    platform: iOS
    sources: [VoiceTrimExtension]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID).MessagesExtension
        COREML_CODEGEN_LANGUAGE: None  # the code uses MLModel directly; a generated "Aligner" class would clash
        # iOS 26 loads icons by asset name, and the + menu reads the extension's, so it gets the square icon too.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: VoiceTrimExtension/Info.plist
      properties:
        CFBundleDisplayName: Siftr
        NSMicrophoneUsageDescription: *mic
        NSSpeechRecognitionUsageDescription: *speech
        NSExtension:
          NSExtensionPointIdentifier: com.apple.message-payload-provider
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).MessagesViewController
