[project]
name = "voicetrim"
version = "0.1.0"
description = "Remove ums, repeats, false starts and long pauses from voice messages, locally."
requires-python = ">=3.11"
dependencies = [
    "crisperwhisper[transformers]",
    # transformers 5.20 breaks Whisper generation inside crisperwhisper 2.0.3
    "transformers>=5.14,<5.18",
    "av",
    "numpy",
    "soundfile",
    "soxr",
    "fastapi",
    "uvicorn",
    "python-multipart",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
voicetrim = "voicetrim.cli:main"
voicetrim-server = "voicetrim.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
